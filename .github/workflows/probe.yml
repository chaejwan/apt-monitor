name: 수집 진단

# GitHub Actions 환경에서 매물·실거래 출처가 응답하는지 확인합니다.
# Actions 탭 → 수집 진단 → Run workflow 에서 진단 대상을 고르고 실행하면,
# 결과가 실행 화면 요약에 표시되고 probe/report.md · probe/alt_report.md 로 저장소에도 기록됩니다.

on:
  workflow_dispatch:
    inputs:
      target:
        description: "진단 대상 — naver: 네이버부동산 API / alt: KB부동산·직방 매물"
        type: choice
        options: [alt, naver]
        default: alt
      complex_no:
        description: "네이버 단지번호 (네이버부동산 단지 주소의 /complexes/ 뒤 숫자)"
        required: true
        default: "3084"
      keyword:
        description: "단지명 (alt 진단에서 검색할 이름)"
        default: "파크타운"
      address:
        description: "동 이름 (같은 이름 단지 구분용)"
        default: "수내동"
      browser:
        description: "naver 진단에서 브라우저 렌더링까지 확인"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: data-commit
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 내려받기
        uses: actions/checkout@v4

      - name: 파이썬 준비
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 브라우저 설치
        if: ${{ inputs.target == 'alt' || inputs.browser }}
        run: |
          pip install --quiet playwright
          python -m playwright install --with-deps chromium

      - name: 네이버 진단
        if: ${{ inputs.target == 'naver' }}
        env:
          MOLIT_API_KEY: ${{ secrets.MOLIT_API_KEY }}
        run: |
          rm -rf probe/samples
          python3 probe/naver_probe.py --complex "${{ inputs.complex_no }}" ${{ inputs.browser && '--browser' || '' }}

      - name: 대체 출처 진단
        if: ${{ inputs.target == 'alt' }}
        run: |
          rm -rf probe/alt_samples
          python3 probe/alt_probe.py --keyword "${{ inputs.keyword }}" --address "${{ inputs.address }}"

      - name: 결과 기록
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A probe
          git diff --cached --quiet || git commit -m "수집 진단 결과 갱신 [skip ci]"
          git push
